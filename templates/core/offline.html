{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Offline" %}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <i class="bi bi-wifi-off display-1 text-body-secondary" aria-hidden="true"></i>
  <h1 class="h4 mt-3">{% translate "You're offline" %}</h1>
  <p class="text-body-secondary">
    {% translate "This app needs a connection to the server to submit and track downloads. Reconnect and try again." %}
  </p>
</div>
{% endblock %}
