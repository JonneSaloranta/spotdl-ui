# Reverse proxy in front of Gunicorn. Serves static/media directly; every
# other path is proxied to the web service. Deliberately has no location for
# /data/downloads — temporary download files must never be reachable over
# HTTP (CLAUDE.md #21/#29).

client_max_body_size 20m;

upstream spotdl_ui_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    location /static/ {
        alias /data/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /data/media/;
        access_log off;
        expires 7d;
    }

    # Library playback (apps/library/views.track_stream). "internal" means
    # this location only answers requests nginx redirects to itself via
    # X-Accel-Redirect from Django — it is not reachable directly, so
    # streaming still goes through Django's login_required + TrackFile
    # lookup first. Do not add a public location for /data/music itself.
    location /protected-music/ {
        internal;
        alias /data/music/;
    }

    location / {
        proxy_pass http://spotdl_ui_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
