name: CI

# Tests + lint on every PR into dev/master and on every direct push to them.
# External services (spotDL subprocess, MusicBrainz's HTTP API, SMTP) are
# always mocked in the test suite itself (CLAUDE.md #25) — only PostgreSQL
# and Redis need to actually run here.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spotdl_ui
          POSTGRES_USER: spotdl_ui
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spotdl_ui -d spotdl_ui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values — never real secrets, and never reused outside this
      # job (CLAUDE.md #29's "secrets not in Git" is about real credentials;
      # a throwaway CI database password is not one).
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: spotdl_ui
      POSTGRES_USER: spotdl_ui
      POSTGRES_PASSWORD: ci-only-password
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      MUSIC_ROOT: ${{ github.workspace }}/.ci-data/music
      DOWNLOAD_TEMP_ROOT: ${{ github.workspace }}/.ci-data/downloads
      STATIC_ROOT: ${{ github.workspace }}/.ci-data/static
      MEDIA_ROOT: ${{ github.workspace }}/.ci-data/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: mkdir -p .ci-data/music .ci-data/downloads .ci-data/static .ci-data/media
      - run: python manage.py migrate --noinput
      - run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
