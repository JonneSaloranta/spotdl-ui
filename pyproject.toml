[tool.ruff]
# Migrations are generated by Django, not hand-written — linting them (e.g.
# ruff's RUF012 on their auto-generated `dependencies = [...]` class
# attributes) just flags standard, expected Django code as a problem. Never
# worth "fixing".
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
# Ruff's own default selection (pyflakes + a small pycodestyle subset) plus
# import-sorting and the RUF-prefixed rules that catch real bugs (unused
# unpacked variables, redundant casts) — not the full "ALL" preset, which
# includes a lot of purely stylistic rules this codebase doesn't follow
# (e.g. docstring conventions incompatible with the "explain *why*" style
# used throughout — see docs/DEVELOPMENT.md's "Code style").
select = ["E4", "E7", "E9", "F", "I", "RUF"]
ignore = [
    # Every Django model's `Meta.indexes`/admin's `list_display`/`actions`/
    # a ModelForm's `Meta.fields` is a class-level list — completely
    # standard, read-only Django idiom, not the mutable-default-argument
    # footgun this rule exists for. Annotating dozens of them with
    # `typing.ClassVar` project-wide would be pure noise for no real safety
    # gain (migrations are already excluded above for the same reason).
    "RUF012",
]
